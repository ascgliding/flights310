{% extends 'base.html' %}

{% block header %}
<h1>{% block title %}Maintain User Profile{% endblock %}</h1>
{% endblock %}

{% block content %}
<form method="POST">
  <fieldset>
    <legend>Login</legend>
    <ul>
      <li>
        <label for="fullname">Name</label>
        <input name="fullname" id="fullname" required value="{{ current_user.fullname }}">
      </li>
      <li>
        <label for="email">EMail Address</label>
        <input name="email" id="email" style="width:50%" required value="{{ current_user.email }}">
      </li>
      {% if pilot is not none %}
          <li>
              <label for="mobile">Mobile</label>
              <input name="mobile" id="mobile" value="{{ pilot.mobile }}" placeholder="02x xxxx xxxx">
          </li>
          <li>
            <label for="email_bfr_warning">Email BFR Warning</label>
            <input type="checkbox" name="email_bfr_warning" id="email_bfr_warning"
                   title="Check to have the system email you weekly warnings before your bfr expires"
                   {{ 'checked="checked"' if pilot.email_bfr_warning else "" }} />
          </li>
          <li>
            <label for="email_med_warning">Email Medical Warning</label>
            <input type="checkbox" name="email_med_warning" id="email_med_warning"
                   title="Check to have the system email you weekly warnings before your medical expires"
                   {{ 'checked="checked"' if pilot.email_med_warning else "" }} />
          </li>
          <li>
            <label for="email_basepass_warning">Email Base Pass Warning</label>
            <input type="checkbox" name="email_basepass_warning" id="email_basepass_warning"
                   title="Check to have the system email you weekly warnings before your Base Pass expires"
                   {{ 'checked="checked"' if pilot.email_basepass_warning else "" }} />
          </li>
      {% endif %}
      {% if current_user.administrator %}
      <li>
        <label for="administrator">Administrator</label>
        <input type="checkbox" name="administrator" id="administrator" {{ 'checked="checked"' if current_user.administrator else "" }} />
      </li>
      <li>
        <label for="approved">Approved</label>
        <input type="checkbox" name="approved" id="approved" {{ 'checked="checked"' if current_user.approved else "" }} />
      </li>
      {% endif %}
    </ul>
  </fieldset>
  <button type="submit" class="textbtn" name="submitbtn" id="submitbtn" title="Press to Submit" value="">Submit</button>
  <button type="submit" class="textbtn" name="pwdbtn" id="pwdbtn" title="Change Password" value="">Password</button>
  <button type="submit" class="textbtn" name="passbtn" id="passbtn" title="Update your Base Pass Details " value="">Base Pass</button>
</form>
{% endblock %}
