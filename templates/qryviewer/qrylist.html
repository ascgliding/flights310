{% extends 'base.html' %}

{% block header %}
<div style="display: table; width:100%" >
  <div style="display:table-row">
    <div style="display:table-cell">
      <h1>{% block title %}Query List{% endblock %}</h1>
    </div>
      <div  style="display:table-cell; text-align: right;" >
        <a class="action" href="{{ url_for('qryviewer.qrymaint', id=0) }}"><button id="addbtn"></button></a>
      </div>
    </div>
</div>
{% endblock %}

{% block content %}
  <div class="table">
    <div class="row">
      <div class="heading" >Id</div>
      <div class="heading" >Description</div>
      <div class="heading mobile_port_suppress" >Page title</div>
      <div class="heading " >Run</div>
    </div>
  {% for l in list %}
    <div class="row">
      <div class="cell" align="left"><a href="{{ url_for('qryviewer.qrymaint', id=l.id) }}">{{ l.id }}</a></div>
      <div class="cell" align="left" style="column-width:350px;">{{ l.shortname }}</div>
      <div class="cell  mobile_port_suppress " align="left">{{ l.pagetitle }}</div>
      <div class="cell" align="left"><a href="{{ url_for('qryviewer.qryviewer', id=l.id) }}">Run</a></div>

    </div>
  {% endfor %}
  </div>
{% endblock %}
